[package]
name = "totenrunde-web"
version = "0.1.0"
edition = "2024"
description = "Statischer Web-Server und Health-API für den Totenrunde-Wasm-Port"

[dependencies]
axum = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "fs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
