[package]
name = "totenrunde-web"
version = "0.1.0"
edition = "2024"
description = "Statischer Web-Server und Health-API für den Totenrunde-Wasm-Port"

[dependencies]
axum = "0.8"
bytes = "1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http-body-util = "0.1"
quinn = "0.11.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "fs"] }

[dev-dependencies]
rcgen = "0.13"
