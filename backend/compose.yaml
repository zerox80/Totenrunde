services:
  web:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: ${IMAGE:-ghcr.io/zerox80/totenrunde-web}:${TAG:-latest}
    ports:
      - "${PORT:-8443}:8443/tcp"
      - "${PORT:-8443}:8443/udp"
    environment:
      PUBLIC_PORT: ${PORT:-8443}
      TLS_SERVER_NAME: ${TLS_SERVER_NAME:-localhost}
      TLS_CERT_PATH: /certs/fullchain.pem
      TLS_KEY_PATH: /certs/privkey.pem
    volumes:
      - "${CERT_DIR:-./certs}:/certs:ro"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/app/totenrunde-web", "--healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
