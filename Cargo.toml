[package]
name = "totenrunde"
version = "0.1.0"
edition = "2024"
default-run = "totenrunde"

[dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["3d", "ui", "audio", "wav", "png", "jpeg", "webgl2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
winit = { version = "0.30", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Navigator", "Storage", "Window"] }

[features]
dynamic = ["bevy/dynamic_linking"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = "debuginfo"

[build-dependencies]
embed-resource = "3.0.12"
